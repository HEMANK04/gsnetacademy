services:
  web:
    build: .
    container_name: gsnet
    restart: unless-stopped
    ports:
      # Sirf localhost par expose — internet se direct reach nahi hoga,
      # nginx (host par) isko proxy karega.
      - "127.0.0.1:5000:5000"
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s